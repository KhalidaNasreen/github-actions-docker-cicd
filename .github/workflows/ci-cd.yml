name: Python Docker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application import
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import os; print('Working directory:', os.getcwd())"
          python -c "import app; print('Application loaded from
