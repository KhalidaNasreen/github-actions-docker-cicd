name: Python Docker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application file
        run: |
          test -f app.py || (echo "ERROR: app.py is missing from the repository root" && exit 1)
          python -c "import os, sys; sys.path.insert(0, os.getcwd()); import app; print('App import successful')"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v
